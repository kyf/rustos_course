name: mdBook

on:
  push:
    branches: [main, master]
    paths:
      - "book/**"
      - ".github/workflows/mdbook.yml"
  pull_request:
    paths:
      - "book/**"
      - ".github/workflows/mdbook.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "latest"
      - name: Build book
        run: mdbook build book
